name: Refresh GitHub statistics

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate stats card
        run: node scripts/update-github-stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit updated card
        run: |
          if git diff --quiet -- public/github-stats.svg; then
            echo "GitHub stats have not changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/github-stats.svg
          git commit -m "Update GitHub statistics" -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git push
