<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#05050B"/>
      <stop offset="0.52" stop-color="#0B0916"/>
      <stop offset="1" stop-color="#07110D"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="260" y1="112" x2="940" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F2F0FF"/>
      <stop offset="0.38" stop-color="#9B7BFF"/>
      <stop offset="0.72" stop-color="#FFCC66"/>
      <stop offset="1" stop-color="#7CFFB2"/>
    </linearGradient>
    <radialGradient id="purpleGlow" cx="0" cy="0" r="1" gradientTransform="translate(202 68) rotate(34) scale(520 310)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx="0" cy="0" r="1" gradientTransform="translate(1060 382) rotate(-148) scale(420 260)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10B981" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#FFFFFF" stroke-opacity="0.045"/>
    </pattern>
    <filter id="softGlow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="11" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="420" fill="url(#background)"/>
  <rect width="1200" height="420" fill="url(#purpleGlow)"/>
  <rect width="1200" height="420" fill="url(#greenGlow)"/>
  <rect width="1200" height="420" fill="url(#grid)"/>

  <path d="M0 1H1200" stroke="url(#wordmark)" stroke-width="2"/>
  <path d="M0 419H1200" stroke="url(#wordmark)" stroke-width="2"/>
  <path d="M87 78H224" stroke="#9B7BFF" stroke-width="3"/>
  <path d="M976 342H1113" stroke="#7CFFB2" stroke-width="3"/>

  <g opacity="0.78">
    <circle cx="88" cy="342" r="5" fill="#9B7BFF"/>
    <circle cx="106" cy="342" r="5" fill="#FFCC66"/>
    <circle cx="124" cy="342" r="5" fill="#7CFFB2"/>
  </g>

  <text x="600" y="104" fill="#C7CAD1" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="7" text-anchor="middle">
    ABEL MAJADIBODU / CREATIVE SOFTWARE ENGINEER
  </text>

  <text x="600" y="235" fill="url(#wordmark)" filter="url(#softGlow)" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="112" font-weight="900" letter-spacing="-7" text-anchor="middle">
    AJ4200
  </text>

  <text x="600" y="294" fill="#F2F0FF" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" letter-spacing="5" text-anchor="middle">
    CODE  /  PRODUCTION  /  GAMING
  </text>

  <g font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2">
    <rect x="343" y="330" width="150" height="34" stroke="#9B7BFF" stroke-opacity="0.7"/>
    <text x="418" y="352" fill="#BCA8FF" text-anchor="middle">FULL STACK</text>

    <rect x="513" y="330" width="174" height="34" stroke="#FFCC66" stroke-opacity="0.7"/>
    <text x="600" y="352" fill="#FFDA91" text-anchor="middle">AI SYSTEMS</text>

    <rect x="707" y="330" width="150" height="34" stroke="#7CFFB2" stroke-opacity="0.7"/>
    <text x="782" y="352" fill="#A2FFCB" text-anchor="middle">INTERACTION</text>
  </g>

  <text x="87" y="60" fill="#FFFFFF" fill-opacity="0.34" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="2">
    JHB / ZA
  </text>
  <text x="1113" y="382" fill="#FFFFFF" fill-opacity="0.34" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="2" text-anchor="end">
    BUILD WITH CHARACTER
